name: Deploy

# Production release: every push to main passes CI, migrates the Neon database, then ships to Vercel.
# Repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, DATABASE_URL_UNPOOLED (Neon direct string).
# Repository variable: PRODUCTION_URL (for example https://outbranch.vercel.app).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      APP_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check configuration
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID APP_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -n "${{ secrets.DATABASE_URL_UNPOOLED }}" ] || missing="$missing DATABASE_URL_UNPOOLED"
          if [ -n "$missing" ]; then echo "::error::Missing deploy settings:$missing (APP_URL comes from vars.PRODUCTION_URL)"; exit 1; fi

      - run: npm ci

      # Direct (non -pooler) connection: Prisma Migrate breaks behind PgBouncer.
      - name: Migrate database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Build
        run: |
          npx --yes vercel@65.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65.1.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx --yes vercel@65.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # Registers the new functions with Inngest Cloud.
      - name: Sync Inngest
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors -X PUT "$APP_URL/api/inngest"

      - name: Health check
        run: |
          body=$(curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors "$APP_URL/api/health")
          echo "$body"
          echo "$body" | grep -q '"database":"ok"'
