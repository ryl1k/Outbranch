name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: outbranch
          POSTGRES_PASSWORD: outbranch
          POSTGRES_DB: outbranch_test
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U outbranch" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://outbranch:outbranch@localhost:5442/outbranch_test
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run check
      - run: npm run build
