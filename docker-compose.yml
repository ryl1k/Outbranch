services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outbranch
      POSTGRES_PASSWORD: outbranch
      POSTGRES_DB: outbranch
    ports:
      - "5442:5432"
    volumes:
      - outbranch-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbranch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  outbranch-pg:
